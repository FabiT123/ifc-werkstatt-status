<html lang="de">

<meta name="description" content="IFC-Modelle offline ansehen, bearbeiten, attributieren und exportieren.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10Z' fill='%23C2410C'/%3E%3Cpath d='M16 3 28 10 16 17 4 10Z' fill='%23F4A261'/%3E%3C/svg%3E">
<style>
/* Layout: Werkzeugleiste oben, Struktur links, 3D Mitte, Eigenschaften rechts, Statuszeile unten */
:root {
  --bg: #e9ecef; --panel: #fbfbfc; --panel2: #f2f4f6; --line: #d8dde3; --line2: #e6e9ed;
  --ink: #1a1f27; --ink2: #5a6472; --ink3: #8a93a0;
  --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fbe6d6; --accent-line: #f0b48c;
  --canvas: #dfe3e8; --sel3d: #f26b1d;
  --ok: #2b7a4b; --err: #b42318; --qty: #2d6a8e; --type: #7a5a14;
  --shadow: 0 8px 28px rgba(20, 28, 40, .16);
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, ui-monospace, monospace;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --panel: #1a1e23; --panel2: #21262d; --line: #2f353e; --line2: #262b33;
    --ink: #e5e8ec; --ink2: #9aa4b1; --ink3: #6c7682;
    --accent: #f08a4b; --accent-ink: #1a1009; --accent-soft: #3a2517; --accent-line: #7a4320;
    --canvas: #262b32; --sel3d: #ff8a3d;
    --ok: #5cc28a; --err: #ff7b6e; --qty: #7cb8dc; --type: #d7b46a;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --panel: #1a1e23; --panel2: #21262d; --line: #2f353e; --line2: #262b33;
  --ink: #e5e8ec; --ink2: #9aa4b1; --ink3: #6c7682;
  --accent: #f08a4b; --accent-ink: #1a1009; --accent-soft: #3a2517; --accent-line: #7a4320;
  --canvas: #262b32; --sel3d: #ff8a3d;
  --ok: #5cc28a; --err: #ff7b6e; --qty: #7cb8dc; --type: #d7b46a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); }
svg { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.dim { color: var(--ink3); }

#app { display: grid; height: 100%; grid-template-columns: var(--lw, 340px) minmax(0, 1fr) var(--rw, 370px); grid-template-rows: 48px minmax(0, 1fr) 28px; grid-template-areas: "top top top" "left stage right" "status status status"; }

/* Kopfzeile */
.top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; flex: none; }
.mark { width: 22px; height: 22px; stroke: none; }
.mark .f1 { fill: var(--accent-line); } .mark .f2 { fill: var(--accent); } .mark .f3 { fill: color-mix(in srgb, var(--accent) 70%, #000); }
.bname { font-weight: 650; letter-spacing: .01em; font-size: 14px; }
.file { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; padding-left: 14px; border-left: 1px solid var(--line); color: var(--ink2); }
#file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.tag { font: 600 10.5px/1 var(--mono); padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink2); letter-spacing: .03em; }
.tag:empty { display: none; }
.dirty { font-size: 11px; color: var(--accent); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.dirty::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tools { display: flex; align-items: center; gap: 6px; flex: none; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }

.btn { height: 30px; padding: 0 12px; border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--panel2); border-color: var(--ink3); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #000); border-color: transparent; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn.danger { color: var(--err); }
.btn.danger-fill { background: var(--err); border-color: var(--err); color: #fff; font-weight: 600; }
.ib { width: 26px; height: 26px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 5px; cursor: pointer; color: var(--ink2); padding: 0; flex: none; }
.ib svg, .ico svg { width: 16px; height: 16px; display: block; }
.ib:hover { background: var(--panel2); color: var(--ink); }
.ico { display: inline-grid; place-items: center; }
.link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; }
.link:hover { text-decoration: underline; }
.link.danger { color: var(--err); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.only-narrow { display: none; }

/* Linke Spalte */
.left { grid-area: left; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.search { display: flex; align-items: center; gap: 6px; margin: 10px 10px 8px; padding: 0 8px; height: 32px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel2); }
.search svg { width: 15px; height: 15px; color: var(--ink3); flex: none; }
.search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; height: 100%; }
.search:focus-within { border-color: var(--accent); }
.tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 7px 8px 8px; cursor: pointer; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 550; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
#tree { flex: 1; overflow: auto; padding: 4px 0 24px; }
.row { display: flex; align-items: center; height: 27px; padding-left: calc(var(--d) * 14px + 4px); padding-right: 6px; cursor: default; gap: 2px; user-select: none; }
.row:hover { background: var(--panel2); }
.row.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.caret { width: 20px; height: 22px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--ink3); cursor: pointer; flex: none; }
.caret svg { width: 12px; height: 12px; transition: transform .12s; }
.caret.open svg { transform: rotate(90deg); }
.caret.leaf { cursor: default; }
.lbl { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 7px; overflow: hidden; }
.lbl .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.lbl .sub { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
.cnt { font: 11px var(--mono); color: var(--ink3); font-variant-numeric: tabular-nums; padding: 0 4px; }
.acts { display: flex; gap: 0; }
.acts .ib { width: 22px; height: 22px; opacity: 0; }
.acts .ib svg { width: 14px; height: 14px; }
.row:hover .acts .ib, .acts .ib.off, .acts .ib.mixed { opacity: 1; }
.acts .ib.off { color: var(--ink3); }
.acts .ib.mixed { color: var(--accent); }
.more { margin: 2px 0 6px calc(var(--d) * 14px + 26px); border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 2px 0; }
.search-head { display: flex; gap: 12px; align-items: center; padding: 6px 12px 8px; color: var(--ink2); font-size: 12px; border-bottom: 1px solid var(--line2); margin-bottom: 4px; }
.hint { color: var(--ink2); font-size: 12px; padding: 4px 14px; margin: 0; }
.cat-toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px 10px; border-bottom: 1px solid var(--line2); margin-bottom: 4px; font-size: 12px; color: var(--ink2); }
.cat-toggles label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }

/* Bühne */
.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; background: var(--canvas); overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv:active { cursor: grabbing; }
.vtools { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.seg button { border: 0; background: none; height: 28px; padding: 0 10px; cursor: pointer; font-size: 12px; color: var(--ink2); border-right: 1px solid var(--line2); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--panel2); color: var(--ink); }
.clipbox { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.clipt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); }
#clip { writing-mode: vertical-lr; direction: rtl; height: 180px; width: 22px; accent-color: var(--accent); margin: 0; }
.clipv { font: 11px var(--mono); color: var(--ink); min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--canvas) 70%, transparent); }
.overlay .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px; box-shadow: var(--shadow); width: min(420px, calc(100% - 32px)); text-align: center; }
.overlay h1 { font-size: 18px; margin: 0 0 6px; text-wrap: balance; }
.overlay p { color: var(--ink2); margin: 0 0 14px; }
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.dropzone { position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 12px; display: none; place-items: center; background: color-mix(in srgb, var(--accent-soft) 70%, transparent); font-size: 16px; font-weight: 600; text-align: center; color: var(--ink); pointer-events: none; }
.dropzone small { font: 12px var(--mono); color: var(--ink2); }
body.dragging .dropzone { display: grid; }

/* Rechte Spalte */
.right { grid-area: right; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; display: flex; flex-direction: column; }
#props { flex: 1; overflow: auto; padding-bottom: 40px; }
.props-empty { padding: 22px 18px; color: var(--ink2); }
.props-empty h3 { color: var(--ink); margin: 0 0 6px; font-size: 15px; }
.props-empty p { margin: 0 0 18px; max-width: 34ch; }
.summary { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; padding: 14px 0 0; border-top: 1px solid var(--line2); }
.summary dt { color: var(--ink3); font-size: 12px; } .summary dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.phead { padding: 14px 16px 10px; border-bottom: 1px solid var(--line2); }
.pclass { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.phead h2 { font-size: 16px; margin: 0 0 4px; line-height: 1.25; word-break: break-word; text-wrap: balance; }
.guid { display: flex; align-items: center; gap: 4px; color: var(--ink2); }
.guid .ib { width: 22px; height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 11.5px; border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 2px 8px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.pbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line2); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.psec { border-bottom: 1px solid var(--line2); }
.shead { width: 100%; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 9px 12px 7px; cursor: pointer; text-align: left; }
.shead:hover { background: var(--panel2); }
.caret-i svg { width: 12px; height: 12px; transform: rotate(90deg); color: var(--ink3); transition: transform .12s; }
.psec.closed .caret-i svg { transform: none; }
.psec.closed .sbody { display: none; }
.stitle { font-weight: 600; font-size: 12.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink2); }
.badge.qty { color: var(--qty); border-color: color-mix(in srgb, var(--qty) 40%, transparent); }
.badge.type { color: var(--type); border-color: color-mix(in srgb, var(--type) 40%, transparent); }
.sbody { padding: 0 12px 10px 16px; }
.kv { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) 24px; align-items: center; gap: 6px; min-height: 28px; }
.kv.ro { grid-template-columns: minmax(0, 42%) minmax(0, 1fr); }
.kv label, .kv .k { color: var(--ink2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv label small, .kv .k small, .kv .v small { color: var(--ink3); font-size: 10.5px; margin-left: 5px; }
.kv .v { overflow-wrap: anywhere; font-size: 12.5px; }
.kv .v.num { font-variant-numeric: tabular-nums; }
.vwrap { display: flex; align-items: center; gap: 4px; min-width: 0; }
.val { width: 100%; min-width: 0; height: 26px; border: 1px solid transparent; border-radius: 4px; background: transparent; padding: 0 6px; font-size: 12.5px; }
.val:hover { border-color: var(--line); }
.val:focus { border-color: var(--accent); background: var(--panel); outline: none; }
.val.numv { font-variant-numeric: tabular-nums; }
.val::placeholder { color: var(--ink3); font-style: italic; }
select.val { padding: 0 2px; }
.unit { font-size: 11px; color: var(--ink3); flex: none; }
.ib.del { width: 22px; height: 22px; opacity: 0; }
.ib.del svg { width: 12px; height: 12px; }
.kv:hover .ib.del, .ib.del:focus-visible { opacity: 1; }
.ib.del:hover { color: var(--err); }
.ib-sp { width: 22px; }
.sfoot { display: flex; justify-content: space-between; gap: 10px; padding-top: 6px; }
.note { color: var(--ink2); font-size: 12px; margin: 2px 0 8px; }

/* Statuszeile */
.status { grid-area: status; display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--panel); color: var(--ink2); font-size: 11.5px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.status .grow { flex: 1; }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--panel); color: var(--ink); width: min(480px, calc(100% - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 14, 20, .35); }
.dhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; margin: 0; }
.dhead h3 { margin: 0; font-size: 15px; }
#dlg-body { padding: 4px 16px 6px; max-height: 64vh; overflow: auto; }
.dfoot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px 16px; }
.form { display: flex; flex-direction: column; gap: 4px; }
.form label { font-size: 12px; color: var(--ink2); margin-top: 8px; }
.form input:not([type=checkbox]):not([type=radio]), .form select { height: 32px; border: 1px solid var(--line); border-radius: var(--r); padding: 0 8px; background: var(--panel); }
.form input:focus, .form select:focus { border-color: var(--accent); outline: none; }
.form fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px 10px; margin: 6px 0 0; }
.form legend { font-size: 12px; color: var(--ink2); padding: 0 4px; }
.form .radio { display: flex; gap: 8px; align-items: center; margin: 4px 0 0; color: var(--ink); font-size: 13px; }
.form p { margin: 0 0 6px; }
.collist { display: grid; grid-template-columns: 1fr; gap: 2px; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; }
.collist label { display: flex; gap: 8px; align-items: center; margin: 0; color: var(--ink); font: 12px var(--mono); }
.help h4 { margin: 12px 0 4px; font-size: 13px; }
.help p { margin: 0; color: var(--ink2); max-width: 62ch; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 4px 0 0; }
.keys dd { margin: 0; color: var(--ink2); }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: var(--panel2); }

/* Meldung */
.toast { position: fixed; right: 18px; top: 64px; left: auto; bottom: auto; transform: translate(0, -8px); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r); font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: min(560px, calc(100% - 32px)); box-shadow: var(--shadow); z-index: 50; }
.toast.show { opacity: 1; transform: translate(0, 0); }
.toast.ok::before { content: "✓  "; color: var(--ok); font-weight: 700; }
.toast.err { background: var(--err); color: #fff; }

@media (max-width: 1180px) {
  #app { grid-template-columns: var(--lw, 300px) minmax(0, 1fr) var(--rw, 330px); }
  #btn-import { display: none; }
}
@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "stage" "status"; }
  .only-narrow { display: inline-grid; }
  .file { display: none; }
  .tools .btn:not(.primary), .tools .sep { display: none; }
  .left, .right { position: fixed; top: 48px; bottom: 28px; width: min(340px, 88vw); z-index: 20; box-shadow: var(--shadow); transition: transform .2s; }
  .left { left: 0; transform: translateX(-102%); }
  .right { right: 0; transform: translateX(102%); }
  body.show-left .left, body.show-right .right { transform: none; }
  .status .dim { display: none; }
  #clip { height: 120px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Ausmass & Vorlagen ---------- */
dialog.wide { width: min(760px, calc(100% - 32px)); }
.rtabs { padding-top: 6px; }
.chip { height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); cursor: pointer; font-size: 12px; white-space: nowrap; color: var(--ink2); }
.chip:hover:not(:disabled) { border-color: var(--ink3); color: var(--ink); }
.chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: default; }
.btn.on, .seg button.on { background: var(--accent-soft); color: var(--accent); }
.btn .ico, .btn svg { width: 14px; height: 14px; }
.btn.sm { display: inline-flex; align-items: center; gap: 5px; }
.lnk { border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; text-align: left; font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; flex-direction: column; }
.lnk:hover { color: var(--accent); }
.lnk small { color: var(--ink3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
#tree.am { padding: 0 0 30px; }
.am-head { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 10px 12px 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.am-empty h3 { margin: 4px 0 6px; font-size: 15px; }
.am-empty p { margin: 0 0 10px; color: var(--ink2); font-size: 12.5px; }
.am-btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.am-empty .am-btns { flex-direction: column; align-items: stretch; }
.am-title { display: flex; align-items: center; gap: 6px; }
.am-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---------- Layout «Cockpit» (umschaltbar, Klassisch bleibt Standard) ---------- */
.ws, .rail, .drawer, .am-mini { display: none; }
#btn-layout { color: var(--ink2); }
body.lay-cockpit .ws { display: flex; flex: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.ws button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 6px; cursor: pointer; color: var(--ink2); font-weight: 550; }
.ws button:hover { color: var(--ink); }
.ws button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 24, 30, .14); }
body.lay-cockpit #btn-layout { color: var(--accent); }

body.lay-cockpit .am-mini { display: block; height: 3px; margin-top: 3px; border-radius: 2px; background: var(--line2); overflow: hidden; }
.am-mini span { display: block; height: 100%; background: #2f9e6e; }
.am-mini span.up { background: #2f78ea; }

.rail { flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: var(--panel); border-left: 1px solid var(--line); }
.rail button { width: 46px; min-height: 48px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; padding: 4px 0; }
.rail button svg { width: 18px; height: 18px; }
.rail button:hover { background: var(--panel2); color: var(--ink); }
.rail button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.drawer { flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); min-width: 0; min-height: 0; position: relative; }
.dr-grip { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: ns-resize; z-index: 3; }
.dr-grip:hover, .dr-grip:focus-visible { background: color-mix(in srgb, var(--accent) 30%, transparent); outline: none; }
body.dr-closed .dr-grip { display: none; }
.dr-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; padding: 0 10px 0 6px; min-height: 40px; border-bottom: 1px solid var(--line2); }
#dr-toggle svg { transition: transform .12s; }
#dr-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
.dr-tabs { display: flex; gap: 2px; align-self: stretch; }
.dr-tabs button { border: 0; background: none; padding: 0 8px; cursor: pointer; color: var(--ink2); border-bottom: 2px solid transparent; font-weight: 550; display: flex; align-items: center; gap: 6px; }
.dr-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: #2f78ea; }
.dr-tabs button:disabled { opacity: .45; cursor: default; }
.dr-tabs .n { font: 11px var(--mono); color: var(--ink3); background: var(--panel2); border-radius: 8px; padding: 1px 6px; }
.dr-info { display: flex; gap: 12px; font-size: 12px; color: var(--ink2); flex-wrap: wrap; }
.dr-info .mono { color: var(--ink); }
.dr-info .dim { color: var(--ink3); }
.dr-acts { display: flex; gap: 6px; margin-left: auto; }
.dr-body { flex: 1; overflow: auto; min-height: 0; }
body.dr-closed .dr-body { display: none; }
.dr-empty { padding: 14px 16px; }
.dr-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
.dr-tab th { position: sticky; top: 0; z-index: 1; background: var(--panel); text-align: left; font-weight: 550; font-size: 11px; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; padding: 7px 8px; border-bottom: 1px solid var(--line2); }
.dr-tab td { padding: 5px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.dr-tab th:first-child, .dr-tab td:first-child { padding-left: 14px; }
.dr-tab th:last-child, .dr-tab td:last-child { padding-right: 14px; }
.dr-tab .num { text-align: right; }
.dr-tab .b { font-weight: 600; color: var(--ink); }
.dr-tab .dim { color: var(--ink2); }
.dr-tab .code { font-size: 11px; }
.dr-tab tbody tr { cursor: default; }
.dr-tab tbody tr:hover { background: var(--panel2); }
.dr-tab tbody tr.sel { background: var(--accent-soft); }
.status .st-act { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.status .st-act .dot { width: 8px; height: 8px; border-radius: 50%; background: #2f78ea; }

@media (min-width: 901px) {
  body.lay-cockpit #app { grid-template-columns: var(--lw, 440px) minmax(0, 1fr) auto 56px; grid-template-rows: 48px minmax(0, 1fr) auto 28px; grid-template-areas: "top top top top" "left stage right rail" "left drawer right rail" "status status status status"; }
  body.lay-cockpit .right { width: 360px; }
  body.lay-cockpit.rp-closed .right { display: none; }
  body.lay-cockpit .rail { display: flex; grid-area: rail; }
  body.lay-cockpit .drawer { display: flex; grid-area: drawer; height: var(--dr-h, 260px); }
  body.lay-cockpit.dr-closed .drawer { height: auto; }
}
@media (min-width: 901px) and (max-width: 1280px) {
  body.lay-cockpit #app { grid-template-columns: var(--lw, 360px) minmax(0, 1fr) auto 56px; }
  body.lay-cockpit .right { width: 320px; }
  body.lay-cockpit .file { display: none; }
}
@media (max-width: 900px) {
  body.lay-cockpit #app { grid-template-rows: 48px minmax(0, 1fr) auto 28px; grid-template-areas: "top" "stage" "drawer" "status"; }
  body.lay-cockpit .drawer { display: flex; grid-area: drawer; height: min(var(--dr-h, 260px), 40vh); }
  body.lay-cockpit.dr-closed .drawer { height: auto; }
  body.lay-cockpit .ws { display: none; }
  .dr-acts { display: none; }
}

.pf-z { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #b45309; background: rgba(245,158,11,.16); border-radius: 3px; padding: 0 4px; margin-right: 5px; vertical-align: 1px; }
.am-l1 .tx { display: block !important; -webkit-line-clamp: unset !important; }
.am-l1 .tx .pf-t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sg-pick .lvp .tx { white-space: normal; overflow: visible; }
.sg-pick .lvp { align-items: start; padding: 5px 8px; }
.sg-gh { position: sticky; top: 0; z-index: 1; display: flex; gap: 4px; align-items: baseline; padding: 6px 8px 4px; font-size: 11.5px; color: var(--ink2); background: var(--panel2); border-top: 1px solid var(--line); }
.sg-gh b { color: var(--ink); }
.sg-gh .c { margin-left: auto; color: var(--ink3); font-variant-numeric: tabular-nums; }
.sg-cand { color: #d97706; margin-left: 4px; }
.ins-t { display: flex !important; gap: 6px; align-items: baseline; }
.ins-t .pf { flex: 1; }
.ins-bar.mini .ins-t .pf-n { display: none; }
.sg-ps-l { display: flex; gap: 6px; align-items: baseline; }
.sg-x .tx { display: flex; gap: 4px; align-items: baseline; }
.sg-ps-l > b, .sg-ps-l > .u, .sg-x .tx > .u { flex: none; white-space: nowrap; }
.sg-ps-l .pf, .sg-x .tx .pf { flex: 1; }
.sg-pick .lvp { grid-template-columns: 136px minmax(0, 1fr) auto; }
.sg-ps-l { flex-wrap: wrap; row-gap: 2px; }
.sg-ps-l .pf { flex: 1 1 100%; order: 3; }
.ed-opt { align-items: center; padding: 0 8px; min-height: 52px; font-size: 12px; }
.ed-opt .diag-chk { white-space: nowrap; }
/* Ansicht/Werkzeuge in der Kopfzeile */
.hdr-vt { display: flex; align-items: center; flex: none; min-width: 0; }
.hdr-vt:empty { display: none; }
body.vt-hdr .top .file { flex: 0 1 auto; max-width: 340px; }
body.vt-hdr .top .hdr-vt { margin-right: auto; }
.top .vtools { position: static; flex-direction: row; align-items: center; gap: 8px; }
.top .vt-tabs { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.top .vt-tabs button { border: 0; border-radius: 6px; padding: 4px 11px; color: var(--ink2); }
.top .vt-tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 24, 30, .14); }
.top .vt-tabs button.live::after { top: 3px; right: 3px; }
.top .vt-body { background: none; border: 0; padding: 0; box-shadow: none; flex-wrap: nowrap; gap: 6px; }
.top .vt-body .seg { white-space: nowrap; }
/* Werkzeug-Leisten oben rechts in der 3D-Ansicht */
body.vt-hdr .ms-bar { top: 10px; }
body.vt-hdr .ms-bar#ms-bar, body.vt-hdr .ms-bar.ed-bar { left: auto; right: 22px; width: max-content; max-width: calc(100% - 44px); }
body.vt-hdr .grp-view { top: 10px; max-height: calc(100% - 36px); }
.top .sh { display: none; }
body.hdr-compact .top .lg { display: none; }
body.hdr-compact .top .sh { display: inline; }
body.hdr-compact .top .bname { display: none; }
body.hdr-compact .top { gap: 10px; }
body.hdr-compact .top .seg button { padding: 0 7px; }
body.hdr-compact .top .vt-tabs button { padding: 4px 8px; }
body.hdr-compact .top .tools .btn { padding-left: 10px; padding-right: 10px; }
body.vt-hdr .top .file { min-width: 90px; }
body.hdr-compact .top .ws button { padding: 0 8px; }
body.hdr-compact.vt-hdr .top .file { min-width: 70px; padding-left: 10px; }
/* Ausmass: gemessene Bauteile unter der Position */
.am-eh { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; padding: 2px 0 4px; border-bottom: 1px solid var(--line); }
.am-eh .mono { text-transform: none; letter-spacing: 0; color: var(--ink); }
.am-est { font-size: 10.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; padding: 6px 0 2px; }
.am-els { max-height: 360px !important; border-top: 0 !important; }
.am-e { grid-template-columns: minmax(0, 1fr) auto 24px !important; border-bottom: 1px solid var(--line2); padding: 3px 0 !important; }
.am-e .lnk { text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.am-e .lnk small { display: block; color: var(--ink3); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
.am-e.sel { background: var(--accent-soft); }
.am-e.miss .lnk { color: var(--err); }
.am-eq { font-size: 12px; text-align: right; cursor: text; padding: 0 5px; min-width: 60px; font-variant-numeric: tabular-nums; }
.am-eq:hover { background: var(--panel); border-radius: 4px; }
.am-e input { width: 76px; border-color: var(--accent) !important; background: var(--panel) !important; }
.am-miss { font-size: 11.5px; color: var(--err); display: flex; gap: 8px; align-items: center; }
.am-set summary { cursor: pointer; font-size: 11.5px; color: var(--ink2); padding: 2px 0; }
.am-set[open] { display: flex; flex-direction: column; gap: 6px; }
.dr-tab th.srt { cursor: pointer; user-select: none; }
.dr-tab th.srt:hover, .dr-tab th.srt.on { color: var(--ink); }
.dr-tab tfoot td { position: sticky; bottom: 0; background: var(--panel2); font-weight: 600; border-top: 1px solid var(--line); }
.dr-tab tr.dr-grp { cursor: pointer; background: var(--panel2); }
.dr-tab tr.dr-grp:hover { background: var(--accent-soft); }
.dr-tab tr.dr-grp td { font-size: 12px; }
.dr-tab tr.dr-grp .car { display: inline-block; width: 12px; color: var(--ink3); }
.dr-tab tr.dr-grp .n { margin-left: 8px; font: 11px var(--mono); color: var(--ink3); background: var(--panel); border-radius: 8px; padding: 1px 6px; }
.dr-tab tr.dr-grp .btn.sm { height: 22px; padding: 0 8px; font-size: 11px; }
.seg .seg-sel { border: 0; border-right: 1px solid var(--line2); background: none; height: 28px; padding: 0 4px 0 6px; font: inherit; font-size: 12px; color: var(--ink2); cursor: pointer; margin-left: -6px; }
.seg .seg-sel:hover { background: var(--panel2); color: var(--ink); }
#btn-dims { padding-right: 6px; }
.ins-gapbtn { font-size: 11.5px; flex: none; white-space: nowrap; }
.ins-gapbtn.on { background: rgba(30,110,240,.12); border-color: rgba(30,110,240,.5); color: #1e5fd0; }
.ins-copyf { font-size: 11.5px; margin: 0 6px; background: rgba(222,40,150,.08); border-color: rgba(222,40,150,.45); color: #a0146e; }
/* Messen: alles auf einer Zeile – Messarten · Ergebnis · Optionen */
#ms-bar { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 14px; max-width: calc(100% - 44px); padding: 6px 8px; }
body.vt-hdr #ms-bar { max-width: calc(100% - 44px); }
#ms-bar .ms-modes { flex-wrap: nowrap; }
#ms-bar .ms-val { margin-left: 0; padding-left: 14px; border-left: 1px solid var(--line2); }
#ms-bar .ms-val output { font-size: 18px; min-width: 104px; }
#ms-bar .ms-val .ms-lbl { display: none; }
#ms-bar .ms-opts { padding-left: 14px; border-left: 1px solid var(--line2); }
#ms-bar .pop-btn { margin-left: auto; }
#ms-bar .ms-m { min-width: 56px; padding: 4px 6px 3px; font-size: 11px; gap: 2px; }
#ms-bar .ms-m .ico svg { width: 19px; height: 19px; }
#ms-bar .ms-modes { gap: 2px; }
#ms-bar .ms-opts { gap: 6px 10px; flex-wrap: nowrap; white-space: nowrap; }
#ms-bar .ms-opts .btn.sm { padding: 0 8px; }
#ms-bar .pop-btn { margin-left: 0; flex: none; }
#ms-bar { column-gap: 10px; }
#ms-bar .ms-val, #ms-bar .ms-opts { padding-left: 10px; }
.ins-lg i.one { background: rgb(222,40,150); } .ins-lg i.two { background: rgb(118,72,232); }
.btn.ins-fin { background: #d92d20; border-color: #d92d20; color: #fff; }
.btn.ins-fin:hover { background: #b42318; border-color: #b42318; }
.btn.ins-next { background: #16a34a; border-color: #16a34a; color: #fff; }
.btn.ins-next:hover { background: #12833c; border-color: #12833c; }
.dr-sw { border: 0; background: none; cursor: pointer; color: var(--ink2); font-size: 14px; padding: 0 6px; border-radius: 5px; margin-left: -4px; }
.dr-sw:hover { background: var(--panel2); color: var(--ink); }
.dr-swpop { position: fixed; z-index: 60; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-height: 120px; }
.dr-swpop input { height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 9px; background: var(--panel); color: var(--ink); font: inherit; font-size: 12.5px; }
.dr-swl { overflow: auto; display: flex; flex-direction: column; min-height: 0; }
.dr-swo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--ink); }
.dr-swo .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-swo .q { color: var(--ink3); font-size: 11px; }
.dr-swo:hover, .dr-swo.on { background: var(--panel2); }
.dr-swo.cur b { color: #2f78ea; }
/* Arbeitsbereich-Knöpfe (Ansehen/Ausmass/Attribute/Bearbeiten) entfallen – alles über Reiter und Werkzeuge erreichbar */
.top nav.ws { display: none !important; }
.dr-prev { font-size: 11.5px; height: 24px; }
.dr-prev.on { background: rgba(222,40,150,.12); border-color: rgba(222,40,150,.5); color: #a0146e; }
/* Lizenzabfrage */
#lic-gate { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--canvas, #e5e7eb); padding: 16px; }
#lic-gate[hidden] { display: none; }
#lic-gate .lg-box { width: min(520px, 100%); background: var(--panel, #fff); color: var(--ink, #111); border: 1px solid var(--line, #ddd); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.18); padding: 24px 26px; display: flex; flex-direction: column; gap: 10px; font: 13px/1.45 system-ui, sans-serif; }
#lic-gate .lg-brand { font-weight: 700; font-size: 15px; } #lic-gate .lg-brand span { font-weight: 500; color: var(--ink3, #888); font-size: 12px; margin-left: 4px; }
#lic-gate h2 { margin: 6px 0 0; font-size: 18px; }
#lic-gate p { margin: 0; color: var(--ink2, #555); }
#lic-gate textarea { width: 100%; box-sizing: border-box; font: 12px/1.4 ui-monospace, monospace; border: 1px solid var(--line, #ccc); border-radius: 8px; padding: 8px 10px; background: var(--panel2, #fafafa); color: inherit; resize: vertical; }
#lic-gate .lg-err { color: #c62828; min-height: 1em; font-weight: 600; }
#lic-gate .lg-act { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
#lic-gate .lg-file { cursor: pointer; color: var(--accent, #c2410c); font-weight: 600; margin-right: auto; }
#lic-gate button { background: var(--accent, #c2410c); color: #fff; border: 0; border-radius: 7px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
#lic-gate .lg-copy { font-size: 11px; color: var(--ink3, #888); border-top: 1px solid var(--line, #eee); padding-top: 10px; margin-top: 4px; }

/* Darstellung «Präsentation»: Verlaufshintergrund hinter dem Modell */
.stage.look-grad { background: radial-gradient(ellipse at 50% 30%, #f7f9fb 0%, #dde2e8 55%, #c6cdd5 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage.look-grad { background: radial-gradient(ellipse at 50% 30%, #46505d 0%, #2a3038 50%, #181b20 100%); } }
:root[data-theme="dark"] .stage.look-grad { background: radial-gradient(ellipse at 50% 30%, #46505d 0%, #2a3038 50%, #181b20 100%); }
#sel-look { max-width: 190px; }

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ib only-narrow" id="btn-left" aria-label="Struktur ein-/ausblenden" title="Struktur"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path class="f1" d="M16 3 28 10 16 17 4 10Z"/><path class="f2" d="M4 10 16 17v12L4 22Z"/><path class="f3" d="M28 10 16 17v12l12-7Z"/></svg>
      <span class="bname">IFC Werkstatt</span>
    </div>
    <div class="file" title="Geöffnete Datei">
      <span id="file-name">–</span>
      <span class="tag" id="file-schema"></span>
      <span class="dirty" id="file-dirty" hidden title="Ungespeicherte Änderungen">geändert</span>
    </div>
    <div class="hdr-vt" id="hdr-vt"></div>
    <nav class="ws" aria-label="Arbeitsbereich">
      <button data-ws="view" aria-pressed="false" title="Struktur und Eigenschaften">Ansehen</button>
      <button data-ws="am" aria-pressed="true" title="LV, Bauteiltabelle und Ausmass">Ausmass</button>
      <button data-ws="attr" aria-pressed="false" title="Attribute übertragen">Attribute</button>
      <button data-ws="edit" aria-pressed="false" title="Bauteile teilen und verschmelzen">Bearbeiten</button>
    </nav>
    <nav class="tools" aria-label="Datei">
      <button class="btn" id="btn-open" title="IFC öffnen (Ctrl+O)">Öffnen</button>
      <span class="sep"></span>
      <button class="btn" id="btn-undo" disabled>Rückgängig</button>
      <span class="sep"></span>
      <button class="btn" id="btn-import" title="Eigenschaftswerte aus einer Excel- oder CSV-Tabelle in die Bauteile übernehmen (Zuordnung über GlobalId)"><span class="lg">Werte importieren</span><span class="sh">Import</span></button>
      <button class="btn" id="btn-xlsx" title="Liste aller Bauteile mit Eigenschaften und Mengen als Excel"><span class="lg">Bauteilliste exportieren</span><span class="sh">Bauteilliste</span></button>
      <button class="btn primary" id="btn-save" title="Bearbeitete IFC-Datei speichern (Ctrl+S)">IFC speichern</button>
      <button class="ib" id="btn-windows" aria-label="Fenster" title="Bereiche als eigene Fenster öffnen (mehrere Bildschirme)"></button>
      <button class="ib" id="btn-layout" aria-label="Layout wechseln" title="Layout wechseln (Klassisch / Cockpit)"><svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M6 2.5v11M6 9.5h8"/></svg></button>
      <button class="ib" id="btn-help" aria-label="Kurzanleitung" title="Kurzanleitung"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4M8 11.6v.1"/></svg></button>
    </nav>
    <button class="ib only-narrow" id="btn-right" aria-label="Eigenschaften ein-/ausblenden" title="Eigenschaften"><svg viewBox="0 0 16 16"><path d="M3 3h10v10H3zM3 6.5h10M6.5 6.5V13"/></svg></button>
  </header>

  <aside class="left" aria-label="Modellstruktur">
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="search" type="search" placeholder="Suchen oder Eigenschaft=Wert" aria-label="Elemente suchen" autocomplete="off">
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="tree" aria-selected="true">Struktur</button>
      <button role="tab" data-tab="classes" aria-selected="false">Klassen</button>
      <button role="tab" data-tab="groups" aria-selected="false">Gruppen</button>
      <button role="tab" data-tab="lv" aria-selected="false">Ausmass</button>
    </div>
    <div id="tree" role="tree"></div>
  </aside>

  <main class="stage">
    <button class="pnl-tg pnl-l" id="tg-left" title="Linke Leiste ein-/ausklappen ([)" aria-label="Linke Leiste einklappen"><svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
    <button class="pnl-tg pnl-r" id="tg-right" title="Rechte Leiste ein-/ausklappen (])" aria-label="Rechte Leiste einklappen"><svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
    <canvas id="cv" aria-label="3D-Ansicht des Modells"></canvas>
    <canvas id="ms-ov" aria-hidden="true"></canvas>
    <section class="ms-bar" id="ms-bar" aria-label="Messen" hidden></section>
    <section class="ms-bar ins-bar" id="ins-bar" aria-label="Ausmessen" hidden></section>
    <section class="ms-bar ed-bar" id="ed-bar" aria-label="Bauteile bearbeiten" hidden></section>
    <section class="grp-view" id="grp-view" aria-label="Gruppen im Modell" hidden></section>
    <div class="vtools" role="toolbar" aria-label="Ansicht und Werkzeuge" data-vt="view">
      <div class="vt-tabs" role="tablist">
        <button role="tab" data-vtab="view" aria-selected="true">Ansicht</button>
        <button role="tab" data-vtab="tools" aria-selected="false">Werkzeuge</button>
        <button role="tab" data-vtab="am" aria-selected="false" class="vt-am">Ausmass</button>
      </div>
      <div class="vt-body">
      <div class="seg" data-vt="view">
        <button data-view="iso" title="Isometrie (1)">Iso</button>
        <button data-view="top" title="Draufsicht (2)">Oben</button>
        <button data-view="front" title="Ansicht von vorne (3)">Vorne</button>
        <button data-view="side" title="Seitenansicht (4)">Seite</button>
      </div>
      <div class="seg" data-vt="view">
        <button id="btn-fitall" title="Ganzes Modell zeigen (F ohne Auswahl)">Alles</button>
        <button id="btn-fitsel" title="Auswahl zeigen (F)">Auswahl</button>
        <button id="btn-showall" title="Alles einblenden (A)">Einblenden</button>
        <button id="btn-selvis" title="Alle sichtbaren Bauteile auswählen (Ctrl+A)">Alle wählen</button>
        <button id="btn-ghost" title="Ausgeblendete Bauteile sehr transparent zeigen – nicht anklickbar (G)">Transparent</button>
        <button id="btn-dims" title="Kantenlängen der ausgewählten Bauteile anzeigen (L)">Masse</button><select id="sel-dimlim" class="seg-sel" title="Anzahl Kantenlängen begrenzen – es werden die der Kamera am nächsten liegenden gezeigt" aria-label="Anzahl Masse"><option value="0">0</option><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="inf">∞</option></select>
        <button id="btn-edges" title="Kanten der Bauteile hervorheben (K)">Kanten</button><select id="sel-look" class="seg-sel" title="Darstellung des Modells (Test): Licht, Eckschatten, Farben, Hintergrund" aria-label="Darstellung"><option value="A">Darstellung: Standard</option><option value="B">Weiches Licht + Eckschatten</option><option value="C">Weich + sanfte Farben</option><option value="D">Architekturmodell weiss</option><option value="E">Präsentation (Verlauf)</option></select>
      </div>
      <div class="seg" data-vt="tools" aria-label="Werkzeuge"><button id="btn-measure" class="ms-btn" title="Messen: Volumen, Fläche, Länge, Gewicht, Winkel, Zählen (M)">Messen</button><button id="btn-edit" class="ms-btn" title="Bauteile bearbeiten: teilen und verschmelzen (B)">✂ Bearbeiten</button><button id="btn-ausmessen" class="ms-btn am-go" title="Ausgewählte Bauteile einer LV-Position zuordnen und direkt ausmessen (Shift+A)" disabled>Ausmessen</button></div>
      <div class="seg" id="am-tools" data-vt="am" aria-label="Ausmass-Ansicht">
        <button data-am="color" title="Ausgemessene grün, offene orange einfärben">Farben</button>
        <button data-am="measured" title="Nur bereits ausgemessene Bauteile zeigen – alle offenen ausblenden">Nur ausgemessene</button>
        <button data-am="open" title="Nur noch nicht ausgemessene Bauteile zeigen (O wählt sie aus)">Nur offene</button>
        <button data-am="ignored" title="Dauerhaft ausgeblendete Bauteile verwalten">Ignoriert (0)</button>
      </div>
      </div>
    </div>
    <div class="am-legend" id="am-legend"><span class="lg g"></span>ausgemessen <span class="lg o"></span>offen <span class="lg b"></span>aktive Position <span class="lg s"></span>Auswahl</div>
    <div class="clipbox" id="clipbox">
      <button class="clipt" id="clip-tg" title="Horizontalschnitt ein-/ausklappen" aria-expanded="false">Schnitt</button>
      <input type="range" id="clip" min="0" max="100" value="100" aria-label="Schnitthöhe">
      <span class="clipv" id="clip-val">aus</span>
    </div>
    <div class="overlay" id="empty" hidden>
      <div class="card">
        <h1>IFC-Datei und LV hierher ziehen</h1>
        <p id="empty-msg">Oder eine Datei öffnen. Alles läuft lokal in diesem Fenster, ohne Internet.</p>
        <button class="btn primary" id="btn-open2">IFC öffnen</button>
      </div>
    </div>
    <div class="overlay" id="loading" hidden>
      <div class="card">
        <p id="progress-label">Lädt …</p>
        <div class="bar"><span id="progress-bar"></span></div>
      </div>
    </div>
    <div class="dropzone" aria-hidden="true"><span>Loslassen zum Öffnen<br><small>IFC-Modell · LV (PDF, Excel, Word, SIA 451, GAEB, CSV …) · Attributtabelle</small></span></div>
  </main>

  <section class="drawer" id="drawer" aria-label="Bauteiltabelle">
    <div class="dr-grip" id="dr-grip" role="separator" aria-orientation="horizontal" aria-label="Höhe der Bauteiltabelle ändern" tabindex="0"></div>

      return Array.isArray(d.ids) ? d.ids : null;
    } catch (e) { return null; }
  }
  function revokedErr() { var e = new Error('Diese Lizenz wurde vom Lizenzgeber entzogen. Bitte wende dich an Fabian Tobler.'); e.revoked = true; return e; }
  async function checkLic(p) {
    if (p.c === 0 || main.dataset.mode === 'dev') return; // eigene Lizenz ohne Online-Prüfung
    var st = stGet(), now = Date.now();
    if (st.id !== p.id) st = { id: p.id, last: now }; // neue Lizenz: Frist beginnt jetzt
    if (st.rev) { var ids0 = await online(); if (ids0 === null || ids0.indexOf(p.id) >= 0) throw revokedErr(); st.rev = false; st.last = now; } // wieder freigegeben?
    if (!(st.last <= now + 86400000)) st.last = 0; // Uhr zurückgestellt: sofort prüfen
    stSet(st);
    var apply = function (ids) {
      if (ids === null) return false;
      if (ids.indexOf(p.id) >= 0) { st.rev = true; stSet(st); return 'rev'; }
      st.last = Date.now(); stSet(st); if (window.IFCW_LIC) window.IFCW_LIC.chk = st.last; return true;
    };
    if (now - st.last < GRACE) { // innerhalb der Frist: sofort starten, im Hintergrund prüfen
      online().then(function (ids) { if (apply(ids) === 'rev') location.reload(); });
      return;
    }
    var res = apply(await online());
    if (res === 'rev') throw revokedErr();
    if (!res) throw new Error('Die Lizenz muss online geprüft werden (zuletzt vor mehr als 14 Tagen). Bitte mit dem Internet verbinden und neu laden.');
  }
  async function decrypt(p) {
    var raw = b64u(main.textContent.trim());
    if (!p.w) throw new Error('Diese Lizenz passt nicht zu dieser Programmversion.');
    var wk = await crypto.subtle.importKey('jwk', p.w, { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
    var ek = await crypto.subtle.importKey('jwk', JSON.parse(main.dataset.epk), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    var bits = await crypto.subtle.deriveBits({ name: 'ECDH', public: ek }, wk, 256);
    var k = await crypto.subtle.importKey('raw', await crypto.subtle.digest('SHA-256', bits), 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.subarray(0, 12) }, k, raw.subarray(12));
    return new TextDecoder().decode(pt);
  }
  async function run(p) {
    if (started) return;
    await checkLic(p);
    started = true;
    var code = main.dataset.mode === 'enc' ? await decrypt(p) : main.textContent;
    window.IFCW_LIC = { n: p.n, o: p.o || '', e: p.e || '', id: p.id || '', i: p.i || '', c: p.c === 0 ? 0 : 1, chk: stGet().last || 0 };
    exec(code);
  }
  function gate(msg) {
    var g = document.getElementById('lic-gate'); g.hidden = false;
    g.innerHTML = '<div class="lg-box"><div class="lg-brand">IFC Werkstatt <span>' + window.IFCW_VER + '</span></div>' +
      '<h2>Lizenz erforderlich</h2><p>Bitte den erhaltenen Lizenzschlüssel einfügen oder die Lizenzdatei (.ifcwlic) laden.</p>' +
      '<textarea id="lg-key" rows="4" spellcheck="false" placeholder="IFCW2.…"></textarea>' +
      '<div class="lg-err" id="lg-err"></div>' +
      '<div class="lg-act"><label class="lg-file">Lizenzdatei laden …<input type="file" id="lg-file" accept=".ifcwlic,.txt" hidden></label><button id="lg-ok">Freischalten</button></div>' +
      '<p class="lg-copy">© Fabian Tobler · Alle Rechte vorbehalten. Nutzung nur mit gültiger Lizenz. Weitergabe, Vervielfältigung und Veränderung des Programms sind untersagt.</p></div>';
    var err = document.getElementById('lg-err'); err.textContent = msg || '';
    var tryKey = async function (key) {
      try { var p = await verify(key); started = false; await run(p); try { localStorage.setItem('ifcw-lic', key.replace(/\s+/g, '')); } catch (e) { } g.hidden = true; g.innerHTML = ''; }
      catch (e) { started = false; err.textContent = e.name === 'OperationError' ? 'Diese Lizenz passt nicht zu dieser Programmversion.' : e.message; }
    };
    document.getElementById('lg-ok').onclick = function () { tryKey(document.getElementById('lg-key').value); };
    document.getElementById('lg-file').onchange = function (e) { var f = e.target.files[0]; if (f) f.text().then(tryKey); };
  }
  async function license() {
    if (main.dataset.mode === 'dev') return run({ n: 'Entwicklung', id: 'dev' });
    var key = null; try { key = localStorage.getItem('ifcw-lic'); } catch (e) { }
    if (!key) return gate('');
    try { await run(await verify(key)); } catch (e) { started = false; gate(e.name === 'OperationError' ? 'Diese Lizenz passt nicht zu dieser Programmversion.' : e.message); }
  }
  // installierte Version: zuerst prüfen, ob ein neueres Update eingespielt wurde
  if (location.protocol !== 'file:' || !window.indexedDB) return license();
  var t = setTimeout(license, 2500), done = false;
  function go() { if (done) return; done = true; clearTimeout(t); license(); }
  try {
    var r = indexedDB.open('ifcw-update', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('app'); };
    r.onerror = go;
    r.onsuccess = function () {
      try {
        var q = r.result.transaction('app', 'readonly').objectStore('app').get('latest');
        q.onerror = go;
        q.onsuccess = function () {
          var v = q.result;
          if (!done && v && v.html && newer(v.ver, window.IFCW_VER)) { done = true; clearTimeout(t); document.open(); document.write(v.html); document.close(); }
          else {
            // diese (lizenzgeschützte) Version merken: auch eine später installierte ältere Version startet dann diese
            if (SELF && (!v || newer(window.IFCW_VER, v.ver))) try { r.result.transaction('app', 'readwrite').objectStore('app').put({ ver: window.IFCW_VER, html: SELF, at: Date.now() }, 'latest'); } catch (e) { }
            go();
          }
        };
      } catch (e) { go(); }
    };
  } catch (e) { go(); }
})();
